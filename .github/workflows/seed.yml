name: seed

# Seeds content/strings.json for every opted-in repo that doesn't have one.
# Manual only — run once after bootstrap to plant minimal name/description tokens.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Preview only — do not commit catalogs"
        type: boolean
        default: true
      repo:
        description: "Single repo to target (leave blank for all)"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write # OIDC → cf-token-broker, for the catalog-seed door

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - run: npm ci --no-audit --no-fund

      # FAIL CLOSED — #10. Same shape as bootstrap: the old fallback could only
      # write to THIS repo, so `dry-run=false` without the org-wide credential
      # seeded nothing anywhere and still exited green.
      - name: Preflight — the broker is configured
        env:
          BROKER: ${{ vars.CF_BROKER_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BROKER:-}" ]; then
            echo "::error title=seed did NOT run::CF_BROKER_URL is unset, so no token can be" \
              "minted. There is deliberately no GITHUB_TOKEN fallback — it can only write to" \
              "bounded-systems/content-catalog. Set the org variable."
            exit 1
          fi

      # The `catalog-seed` door (infra#387/#395), pinned to THIS workflow at
      # refs/heads/main. Minted on the dry-run lane too — see bootstrap.yml for
      # why a preview on the weaker token is the worse option.
      - name: Mint the catalog-seed token via the OIDC broker
        id: app-token
        uses: bounded-systems/.github/.github/actions/broker-gh-token@99e88a0335519cb78be8a1b6623105613fa6aca1 # broker-gh-token (prx-26bq), .github#109
        with:
          app: catalog-seed
          broker-url: ${{ vars.CF_BROKER_URL }}
          require: contents

      - name: Seed catalogs
        env:
          # The brokered token — org-wide contents:write. No fallback by design.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: bounded-systems
          # Inputs as env vars, never `${{ }}` in the script body — see bootstrap.yml
          # for the reasoning. `repo` is free text and was the live sink.
          DRY_RUN: ${{ inputs.dry-run }}
          REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          case "${REPO:-}" in
            "") ;;
            (*[!A-Za-z0-9._-]*) echo "::error::repo '$REPO' is not a plain repository name"; exit 1 ;;
          esac
          ARGS=()
          if [ "$DRY_RUN" = "false" ]; then
            ARGS+=(--write)
          fi
          if [ -n "${REPO:-}" ]; then
            ARGS+=("--repo=$REPO")
          fi
          node seed.mjs "${ARGS[@]}"

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seed-report
          path: seed-report.json
