name: enrich

# Enriches content/strings.json for every opted-in repo with name · tagline ·
# description · keywords extracted from README and package.json.
# Safe to re-run: skips repos already enriched beyond the seed (>2 tokens).

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Preview only — do not commit"
        type: boolean
        default: true
      force:
        description: "Overwrite already-enriched catalogs"
        type: boolean
        default: false
      repo:
        description: "Single repo to target (leave blank for all)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - run: npm ci --no-audit --no-fund

      # FAIL CLOSED on the write lane — #10. Same shape as bootstrap and seed:
      # the fallback can only write to THIS repo, so `dry-run=false` without the
      # credential enriches nothing anywhere and still exits green.
      - name: Preflight — the write lane has its credential
        env:
          HAS_PAT: ${{ secrets.BOOTSTRAP_TOKEN != '' }}
          WRITES: ${{ inputs.dry-run == false }}
        run: |
          set -euo pipefail
          if [ "$WRITES" = "true" ] && [ "$HAS_PAT" != "true" ]; then
            echo "::error title=enrich did NOT write::BOOTSTRAP_TOKEN is empty and dry-run=false." \
              "The GITHUB_TOKEN fallback can only write to bounded-systems/content-catalog, so no" \
              "catalog would be enriched in any other repo and the run would still go green." \
              "Restore the credential (see #10), or re-dispatch with dry-run=true."
            exit 1
          fi
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::BOOTSTRAP_TOKEN is empty — previewing on the GITHUB_TOKEN fallback," \
              "which reads PUBLIC repos only. Private repos are absent from this preview."
          fi

      - name: Enrich catalogs
        env:
          # Fallback retained for the dry-run lane only — see the preflight above.
          GITHUB_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN || secrets.GITHUB_TOKEN }}
          ORG: bounded-systems
        run: |
          ARGS=""
          if [ "${{ inputs.dry-run }}" = "false" ]; then
            ARGS="--write"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "${{ inputs.repo }}" ]; then
            ARGS="$ARGS --repo=${{ inputs.repo }}"
          fi
          node enrich.mjs $ARGS

      - name: Upload report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: enrich-report
          path: enrich-report.json
