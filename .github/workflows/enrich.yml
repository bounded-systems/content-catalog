name: enrich

# Enriches content/strings.json for every opted-in repo with name · tagline ·
# description · keywords extracted from README and package.json.
# Safe to re-run: skips repos already enriched beyond the seed (>2 tokens).

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Preview only — do not commit"
        type: boolean
        default: true
      force:
        description: "Overwrite already-enriched catalogs"
        type: boolean
        default: false
      repo:
        description: "Single repo to target (leave blank for all)"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write # OIDC → cf-token-broker, for the catalog-enrich door

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - run: npm ci --no-audit --no-fund

      # FAIL CLOSED — #10. Same shape as bootstrap and seed: the old fallback
      # could only write to THIS repo, so `dry-run=false` without the org-wide
      # credential enriched nothing anywhere and still exited green.
      - name: Preflight — the broker is configured
        env:
          BROKER: ${{ vars.CF_BROKER_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BROKER:-}" ]; then
            echo "::error title=enrich did NOT run::CF_BROKER_URL is unset, so no token can be" \
              "minted. There is deliberately no GITHUB_TOKEN fallback — it can only write to" \
              "bounded-systems/content-catalog. Set the org variable."
            exit 1
          fi

      # The `catalog-enrich` door (infra#387/#395), pinned to THIS workflow at
      # refs/heads/main. Minted on the dry-run lane too — see bootstrap.yml.
      - name: Mint the catalog-enrich token via the OIDC broker
        id: app-token
        uses: bounded-systems/.github/.github/actions/broker-gh-token@d126d721fa50275e12af0bdeaf1a2ff3016eedfd # broker-gh-token (prx-26bq), .github#109
        with:
          app: catalog-enrich
          broker-url: ${{ vars.CF_BROKER_URL }}
          require: contents

      - name: Enrich catalogs
        env:
          # The brokered token — org-wide contents:write. No fallback by design.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: bounded-systems
          # Inputs as env vars, never `${{ }}` in the script body — see bootstrap.yml
          # for the reasoning. `repo` is free text and was the live sink.
          DRY_RUN: ${{ inputs.dry-run }}
          FORCE: ${{ inputs.force }}
          REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          case "${REPO:-}" in
            "") ;;
            (*[!A-Za-z0-9._-]*) echo "::error::repo '$REPO' is not a plain repository name"; exit 1 ;;
          esac
          ARGS=()
          if [ "$DRY_RUN" = "false" ]; then
            ARGS+=(--write)
          fi
          if [ "$FORCE" = "true" ]; then
            ARGS+=(--force)
          fi
          if [ -n "${REPO:-}" ]; then
            ARGS+=("--repo=$REPO")
          fi
          node enrich.mjs "${ARGS[@]}"

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enrich-report
          path: enrich-report.json
