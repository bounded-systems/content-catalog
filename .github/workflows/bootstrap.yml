name: bootstrap

# Scans every repo in the org for content catalogs, commits .string-audit.json
# sentinels to newly-discovered ones, then triggers the aggregate workflow so
# the merged catalog refreshes immediately.
#
# Schedule: weekly (Sundays 23:00 UTC) — always writes; triggers aggregate after.
# Manual: workflow_dispatch — dry-run by default; set dry-run=false to commit.
#
# Auth = the `catalog-bootstrap` door, brokered (infra#387/#395): the job proves
# its identity with GitHub Actions OIDC and exchanges it at the cf-token-broker
# for a short-lived installation token scoped to contents:write, pinned to THIS
# workflow at refs/heads/main. No App key and no PAT in this repo. Needs the org
# variable CF_BROKER_URL (not a secret).
#
# This replaced the BOOTSTRAP_TOKEN secret — a long-lived org-wide PAT, revoked
# 2026-08-16 in an account credential audit. It read
# `secrets.BOOTSTRAP_TOKEN || secrets.GITHUB_TOKEN`, and that fallback is the
# whole reason #10 exists: GITHUB_TOKEN can only write to THIS repo and reads
# only PUBLIC ones, so a --write run without the PAT visited every repo, wrote
# nothing anywhere, and exited green. FAILS CLOSED now, on both lanes — a
# brokered mint has no weaker sibling to fall back to, so the preflight the
# fallback made necessary is now just the mint itself.

on:
  schedule:
    - cron: "0 23 * * 0" # Sundays 23:00 UTC (before Monday's aggregate at 06:00)
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Scan only — do not commit sentinels"
        type: boolean
        default: true
      all:
        description: "Add default sentinel to every repo (not just discovered ones)"
        type: boolean
        default: false
      repo:
        description: "Single repo name to target (leave blank for all)"
        type: string
        default: ""

permissions:
  contents: read
  actions: write # needed to trigger aggregate after writing sentinels
  id-token: write # OIDC → cf-token-broker, for the catalog-bootstrap door

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - run: npm ci --no-audit --no-fund

      # FAIL CLOSED — #10. The old GITHUB_TOKEN fallback could only write to THIS
      # repo, so a --write run without the org-wide credential visited every repo,
      # wrote no sentinel anywhere, and exited green.
      - name: Preflight — the broker is configured
        env:
          BROKER: ${{ vars.CF_BROKER_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BROKER:-}" ]; then
            echo "::error title=bootstrap did NOT run::CF_BROKER_URL is unset, so no token can be" \
              "minted. There is deliberately no GITHUB_TOKEN fallback: it can only write to" \
              "bounded-systems/content-catalog, so the run would visit every repo, write nothing," \
              "and go green. Set the org variable."
            exit 1
          fi

      # The `catalog-bootstrap` door (infra#387/#395), pinned to THIS workflow at
      # refs/heads/main. `require: contents` asserts the granted scope BEFORE any
      # work, so a narrowed door fails at the mint naming the gap rather than
      # 403-ing partway through a sweep with some repos already written.
      #
      # Minted on BOTH lanes, including dry-run. The door is per-workflow, so the
      # alternative is a GITHUB_TOKEN fallback for previews — which is exactly the
      # silent public-repos-only degradation #10 removed. A dry-run preview that
      # quietly omits private repos is a worse failure than a slightly
      # over-scoped preview.
      - name: Mint the catalog-bootstrap token via the OIDC broker
        id: app-token
        uses: bounded-systems/.github/.github/actions/broker-gh-token@f0abde23ce4a8dc5042f80ee6a0919585b97d5e9 # broker-gh-token (prx-26bq), .github#109
        with:
          app: catalog-bootstrap
          broker-url: ${{ vars.CF_BROKER_URL }}
          require: contents

      - name: Bootstrap sentinels
        env:
          # The brokered token — org-wide contents:write, so sentinels land in
          # other repos. No fallback by design; see the preflight above.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: bounded-systems
          # Every dispatch input arrives as an ENV VAR, never as `${{ }}` inside the
          # script body. The template engine substitutes before bash ever sees the
          # text, so an interpolated free-text input is not a shell string — it is
          # shell SOURCE. `repo` is the free-text one and was the live sink.
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry-run }}
          ALL: ${{ inputs.all }}
          REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          # Validate before use, in the shape claim-ticket.yml already uses for the
          # same class of input: refuse anything that is not a plain repo name rather
          # than trying to escape it.
          case "${REPO:-}" in
            "") ;;
            (*[!A-Za-z0-9._-]*) echo "::error::repo '$REPO' is not a plain repository name"; exit 1 ;;
          esac
          # Array, not a string: no word-splitting of anything caller-supplied.
          ARGS=()
          # schedule always writes; dispatch respects dry-run input
          # (boolean dispatch inputs are strings "true"/"false" in shell)
          if [ "$EVENT_NAME" = "schedule" ] || [ "$DRY_RUN" = "false" ]; then
            ARGS+=(--write)
          fi
          if [ "$ALL" = "true" ]; then
            ARGS+=(--all)
          fi
          if [ -n "${REPO:-}" ]; then
            ARGS+=("--repo=$REPO")
          fi
          node bootstrap.mjs "${ARGS[@]}"

      - name: Trigger aggregate (if new sentinels were written)
        # Only fire when we actually wrote something — avoids a spurious aggregate run
        # on dry-run dispatches or weeks with no new repos.
        if: >
          github.event_name == 'schedule' ||
          inputs.dry-run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FOUND=$(node -e "try{const r=JSON.parse(require('fs').readFileSync('bootstrap-report.json','utf8'));process.stdout.write(String(r.found.length))}catch{process.stdout.write('0')}")
          if [ "$FOUND" -gt "0" ]; then
            echo "  $FOUND new repo(s) — triggering aggregate"
            gh workflow run aggregate.yml --repo bounded-systems/content-catalog
          else
            echo "  no new repos — skipping aggregate trigger"
          fi

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-report
          path: bootstrap-report.json
