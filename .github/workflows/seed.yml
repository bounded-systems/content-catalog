name: seed

# Seeds content/strings.json for every opted-in repo that doesn't have one.
# Manual only — run once after bootstrap to plant minimal name/description tokens.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Preview only — do not commit catalogs"
        type: boolean
        default: true
      repo:
        description: "Single repo to target (leave blank for all)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - run: npm ci --no-audit --no-fund

      - name: Seed catalogs
        env:
          GITHUB_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN || secrets.GITHUB_TOKEN }}
          ORG: bounded-systems
        run: |
          ARGS=""
          if [ "${{ inputs.dry-run }}" = "false" ]; then
            ARGS="--write"
          fi
          if [ -n "${{ inputs.repo }}" ]; then
            ARGS="$ARGS --repo=${{ inputs.repo }}"
          fi
          node seed.mjs $ARGS

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seed-report
          path: seed-report.json
