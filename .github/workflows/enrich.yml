name: enrich

# Enriches content/strings.json for every opted-in repo with name · tagline ·
# description · keywords extracted from README and package.json.
# Safe to re-run: skips repos already enriched beyond the seed (>2 tokens).

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Preview only — do not commit"
        type: boolean
        default: true
      force:
        description: "Overwrite already-enriched catalogs"
        type: boolean
        default: false
      repo:
        description: "Single repo to target (leave blank for all)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - run: npm ci --no-audit --no-fund

      - name: Enrich catalogs
        env:
          GITHUB_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN || secrets.GITHUB_TOKEN }}
          ORG: bounded-systems
        run: |
          ARGS=""
          if [ "${{ inputs.dry-run }}" = "false" ]; then
            ARGS="--write"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "${{ inputs.repo }}" ]; then
            ARGS="$ARGS --repo=${{ inputs.repo }}"
          fi
          node enrich.mjs $ARGS

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enrich-report
          path: enrich-report.json
