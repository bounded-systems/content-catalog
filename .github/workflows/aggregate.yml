name: aggregate

# Nightly org-wide content catalog: discover opted-in repos, merge their
# content-token catalogs, gate with string-audit's prose + grounding rules,
# attest the result (SLSA Build L2), and commit the merged catalog back.
#
# Also triggered by bootstrap when it writes new sentinels.
#
# Consumers verify provenance:
#   gh attestation verify catalog.merged.json --owner bounded-systems
#
# Opt a repo in by adding .string-audit.json to its root:
#   { "catalogPath": "dist/catalog.json", "groundingPath": "dist/grounding.json" }

on:
  schedule:
    - cron: "0 6 * * 1-5" # weekdays 06:00 UTC (Mon–Fri)
  workflow_dispatch:

permissions:
  contents: write       # write the refresh BRANCH (not main — see #15)
  pull-requests: write  # open the refresh PR; main is PR-only by org ruleset
  id-token: write       # OIDC token for SLSA attestation, and the broker mint
  attestations: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Checkout string-audit (audit-gate.mjs + prose.mjs)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: bounded-systems/string-audit
          # Pinned to an immutable commit SHA; bump to pick up gate rule fixes.
          #
          # THIS PIN IS LOAD-BEARING FOR grounding.merged.json's SHAPE (#14). aggregate.mjs
          # emits grounding keyed by repo; a gate that predates string-audit#73 calls
          # .some() on it and dies. Do not lower this pin without reverting aggregate.mjs
          # to a flat array — and do not raise aggregate.mjs's shape ahead of a gate that
          # reads it.
          #
          # This was `v0.8.0` — a tag that does not exist. #16 pinned the version mint was
          # PREDICTED to cut from string-audit#73, on the assumption that #73 would merge
          # and release first; both merged within the same minute and no release was cut,
          # so every run would have died at this checkout. Pinning the merge commit removes
          # the dependency on a release existing at all, and matches how `site` pins this
          # same repo. Move it to the release tag once one is cut, if you prefer a tag.
          ref: 59c38668e822410c989c614557f03eb30218402c # string-audit#73 (grounding namespacing)
          path: .string-audit

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Install deps (prose.mjs needs an-array-of-english-words + write-good)
        run: npm ci --no-audit --no-fund

      # FAIL CLOSED — #10. aggregate.mjs enumerates the org with
      # `GET /orgs/{org}/repos` (aggregate.mjs:47). The repo-scoped GITHUB_TOKEN
      # sees PUBLIC repos only, so without an org-wide credential every private
      # repo drops silently out of that enumeration. The non-empty guard below
      # does NOT catch it — public repos still supply symbols — and the narrowed
      # catalog is then committed AND attested, so a partial artifact would ship
      # carrying full SLSA provenance. A missing credential must close the door,
      # not quietly narrow what gets certified.
      - name: Preflight — the broker is configured
        env:
          BROKER: ${{ vars.CF_BROKER_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BROKER:-}" ]; then
            echo "::error title=aggregate did NOT run::CF_BROKER_URL is unset, so no token can be" \
              "minted and the org enumeration would see public repos only — every private repo" \
              "would drop out of catalog.merged.json silently, because the non-empty guard still" \
              "passes. The catalog is committed AND attested, so this run would certify a partial" \
              "artifact as complete. Set the org variable; do not fall back to GITHUB_TOKEN."
            exit 1
          fi

      # The `catalog-aggregate` door (infra#387/#395): OIDC in, short-lived
      # installation token out, pinned to THIS workflow at refs/heads/main. No
      # long-lived PAT anywhere — the App key lives only in the broker.
      #
      # NO `require:` HERE, DELIBERATELY. The action's assertion checks for a
      # scope granted at WRITE, and this door is contents:READ by design — it
      # enumerates and reads, and commits the merged catalog to THIS repo on the
      # built-in GITHUB_TOKEN below. Declaring `require: contents` would fail the
      # mint on a correctly-scoped door. The three write lanes do declare it.
      - name: Mint the catalog-aggregate token via the OIDC broker
        id: app-token
        uses: bounded-systems/.github/.github/actions/broker-gh-token@d1b25e3bb48ba919f2af0f1ab83063a1d76d88d4 # broker-gh-token (prx-26bq), .github#109
        with:
          app: catalog-aggregate
          broker-url: ${{ vars.CF_BROKER_URL }}

      - name: Discover + merge catalogs
        env:
          # The brokered token — org-wide contents:read, so private repos are
          # visible to the enumeration. No fallback: a mint failure is a red run,
          # which is the whole point of #10.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: bounded-systems
        run: node aggregate.mjs

      - name: Verify catalog is non-empty before gating + attesting
        run: |
          COUNT=$(node -e "const c=JSON.parse(require('fs').readFileSync('catalog.merged.json','utf8'));console.log(Object.keys(c).filter(k=>!k.startsWith('\$')).length)")
          echo "  symbols: $COUNT"
          [ "$COUNT" -gt "0" ] || { echo "::error::catalog.merged.json is empty — aggregate.mjs found no opted-in repos"; exit 1; }

      - name: Content gate (prose + grounding — strict)
        env:
          CATALOG: ${{ github.workspace }}/catalog.merged.json
          GROUNDING: ${{ github.workspace }}/grounding.merged.json
        run: node .string-audit/audit-gate.mjs --strict

      - name: Attest catalog provenance (SLSA Build L2)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: catalog.merged.json

      # PROPOSE the refreshed catalog; do not push it. #15.
      #
      # This step used to `git push` straight to main, which cannot work: the org's
      # default-branch-protection ruleset covers ~ALL repos and demands a pull
      # request, verified signatures and linear history. Every run was rejected with
      # GH013 AFTER doing all the expensive work — enumerate 92 repos, gate, attest —
      # so the lane built a complete attested catalog and then could not store it.
      #
      # Two rules, and only one of them is about signing. `signed-commit` writes via
      # GraphQL createCommitOnBranch so the commit is GitHub-SIGNED (a runner's
      # `git commit` is not), but a signed commit pushed to main is still refused:
      # "changes must be made through a pull request" is independent. Hence a branch
      # plus a PR, which is also the org's one-auditable-pipeline rule finally
      # applying to this lane rather than being sidestepped by it.
      #
      # Two files, so two writes onto the same branch; the PR is opened separately
      # below, guarded on either write having actually changed something, so an
      # unchanged night proposes nothing instead of opening an empty PR.
      - name: Publish catalog.merged.json to a branch (signed)
        id: pub-catalog
        uses: bounded-systems/.github/.github/actions/signed-commit@bf15e558da0cb27364fc15090d80fc705e052e43 # signed-commit
        with:
          path: catalog.merged.json
          branch: catalog/refresh-${{ github.run_id }}
          base: main
          message: "chore: refresh merged catalog (run ${{ github.run_id }})"
          token: ${{ secrets.GITHUB_TOKEN }}
          # An unsigned commit here is worse than no commit: it cannot merge under
          # the signature rule, so it would leave a dead branch and a green step.
          fail-if-unsigned: "true"

      - name: Publish grounding.merged.json to the same branch (signed)
        id: pub-grounding
        uses: bounded-systems/.github/.github/actions/signed-commit@bf15e558da0cb27364fc15090d80fc705e052e43 # signed-commit
        with:
          path: grounding.merged.json
          branch: catalog/refresh-${{ github.run_id }}
          base: main
          message: "chore: refresh merged grounding (run ${{ github.run_id }})"
          token: ${{ secrets.GITHUB_TOKEN }}
          fail-if-unsigned: "true"

      - name: Open the refresh PR (only when something changed)
        if: ${{ steps.pub-catalog.outputs.changed == 'true' || steps.pub-grounding.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: catalog/refresh-${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CATALOG_CHANGED: ${{ steps.pub-catalog.outputs.changed }}
          GROUNDING_CHANGED: ${{ steps.pub-grounding.outputs.changed }}
        run: |
          set -euo pipefail
          body="$(cat <<PR_BODY_EOF
          Automated catalog refresh from [run ${GITHUB_RUN_ID}](${RUN_URL}).

          - \`catalog.merged.json\` changed: ${CATALOG_CHANGED}
          - \`grounding.merged.json\` changed: ${GROUNDING_CHANGED}

          Produced by the \`aggregate\` lane: org-wide discovery over opted-in repos
          using a brokered \`catalog-aggregate\` token, gated by string-audit's prose
          and grounding rules under \`--strict\`, and attested (SLSA Build L2) before
          this PR was opened. Merging is the last step, not a rubber stamp — the gate
          and the attestation already ran against exactly these bytes.
          PR_BODY_EOF
          )"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: refresh merged catalog (run ${GITHUB_RUN_ID})" \
            --body "$body" --draft \
            || gh pr edit "$BRANCH" --body "$body"
