name: seed

# Seeds content/strings.json for every opted-in repo that doesn't have one.
# Manual only — run once after bootstrap to plant minimal name/description tokens.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Preview only — do not commit catalogs"
        type: boolean
        default: true
      repo:
        description: "Single repo to target (leave blank for all)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - run: npm ci --no-audit --no-fund

      # FAIL CLOSED on the write lane — #10. Same shape as bootstrap: the
      # fallback can only write to THIS repo, so `dry-run=false` without the
      # credential seeds nothing anywhere and still exits green.
      - name: Preflight — the write lane has its credential
        env:
          HAS_PAT: ${{ secrets.BOOTSTRAP_TOKEN != '' }}
          WRITES: ${{ inputs.dry-run == false }}
        run: |
          set -euo pipefail
          if [ "$WRITES" = "true" ] && [ "$HAS_PAT" != "true" ]; then
            echo "::error title=seed did NOT write::BOOTSTRAP_TOKEN is empty and dry-run=false." \
              "The GITHUB_TOKEN fallback can only write to bounded-systems/content-catalog, so no" \
              "catalog would be seeded in any other repo and the run would still go green." \
              "Restore the credential (see #10), or re-dispatch with dry-run=true."
            exit 1
          fi
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::BOOTSTRAP_TOKEN is empty — previewing on the GITHUB_TOKEN fallback," \
              "which reads PUBLIC repos only. Private repos are absent from this preview."
          fi

      - name: Seed catalogs
        env:
          # Fallback retained for the dry-run lane only — see the preflight above.
          GITHUB_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN || secrets.GITHUB_TOKEN }}
          ORG: bounded-systems
          # Inputs as env vars, never `${{ }}` in the script body — see bootstrap.yml
          # for the reasoning. `repo` is free text and was the live sink.
          DRY_RUN: ${{ inputs.dry-run }}
          REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          case "${REPO:-}" in
            "") ;;
            (*[!A-Za-z0-9._-]*) echo "::error::repo '$REPO' is not a plain repository name"; exit 1 ;;
          esac
          ARGS=()
          if [ "$DRY_RUN" = "false" ]; then
            ARGS+=(--write)
          fi
          if [ -n "${REPO:-}" ]; then
            ARGS+=("--repo=$REPO")
          fi
          node seed.mjs "${ARGS[@]}"

      - name: Upload report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: seed-report
          path: seed-report.json
