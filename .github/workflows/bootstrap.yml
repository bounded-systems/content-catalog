name: bootstrap

# Scans every repo in the org for content catalogs, commits .string-audit.json
# sentinels to newly-discovered ones, then triggers the aggregate workflow so
# the merged catalog refreshes immediately.
#
# Schedule: weekly (Sundays 23:00 UTC) — always writes; triggers aggregate after.
# Manual: workflow_dispatch — dry-run by default; set dry-run=false to commit.
#
# Requires BOOTSTRAP_TOKEN secret: an org-wide credential with `repo` scope.
# Without it the scan still works (GITHUB_TOKEN reads PUBLIC repos), but the
# fallback can only write to this repo — and it reads only public ones, so
# private repos are invisible to the scan either way.
#
# The read-only lane keeps that fallback; the WRITE lane fails closed (#10).
# The original degraded mode wrote nothing and reported success, so a --write
# run with no credential was indistinguishable from one that had nothing to do.

on:
  schedule:
    - cron: "0 23 * * 0" # Sundays 23:00 UTC (before Monday's aggregate at 06:00)
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Scan only — do not commit sentinels"
        type: boolean
        default: true
      all:
        description: "Add default sentinel to every repo (not just discovered ones)"
        type: boolean
        default: false
      repo:
        description: "Single repo name to target (leave blank for all)"
        type: string
        default: ""

permissions:
  contents: read
  actions: write # needed to trigger aggregate after writing sentinels

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - run: npm ci --no-audit --no-fund

      # FAIL CLOSED on the write lane — #10. The fallback below can only write
      # to THIS repo, so a --write run without the credential visits every repo,
      # writes no sentinel anywhere, and exits green. Refuse instead; the
      # read-only lane (dry-run dispatch) still runs on the fallback.
      - name: Preflight — the write lane has its credential
        env:
          HAS_PAT: ${{ secrets.BOOTSTRAP_TOKEN != '' }}
          WRITES: ${{ github.event_name == 'schedule' || inputs.dry-run == false }}
        run: |
          set -euo pipefail
          if [ "$WRITES" = "true" ] && [ "$HAS_PAT" != "true" ]; then
            echo "::error title=bootstrap did NOT write::BOOTSTRAP_TOKEN is empty and this is a" \
              "write run (schedule, or dry-run=false). The GITHUB_TOKEN fallback can only write" \
              "to bounded-systems/content-catalog, so no sentinel would be committed to any other" \
              "repo and the run would still go green. Restore the credential (preferably an OIDC" \
              "broker mint, not a new long-lived PAT — see #10), or dispatch with dry-run=true to" \
              "scan without writing."
            exit 1
          fi
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::BOOTSTRAP_TOKEN is empty — scanning on the GITHUB_TOKEN fallback," \
              "which reads PUBLIC repos only. Private repos will not appear in this report."
          fi

      - name: Bootstrap sentinels
        env:
          # Fallback retained for the read-only lane only; the preflight above
          # refuses the write lane when it would resolve to GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN || secrets.GITHUB_TOKEN }}
          ORG: bounded-systems
          # Every dispatch input arrives as an ENV VAR, never as `${{ }}` inside the
          # script body. The template engine substitutes before bash ever sees the
          # text, so an interpolated free-text input is not a shell string — it is
          # shell SOURCE. `repo` is the free-text one and was the live sink.
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry-run }}
          ALL: ${{ inputs.all }}
          REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          # Validate before use, in the shape claim-ticket.yml already uses for the
          # same class of input: refuse anything that is not a plain repo name rather
          # than trying to escape it.
          case "${REPO:-}" in
            "") ;;
            (*[!A-Za-z0-9._-]*) echo "::error::repo '$REPO' is not a plain repository name"; exit 1 ;;
          esac
          # Array, not a string: no word-splitting of anything caller-supplied.
          ARGS=()
          # schedule always writes; dispatch respects dry-run input
          # (boolean dispatch inputs are strings "true"/"false" in shell)
          if [ "$EVENT_NAME" = "schedule" ] || [ "$DRY_RUN" = "false" ]; then
            ARGS+=(--write)
          fi
          if [ "$ALL" = "true" ]; then
            ARGS+=(--all)
          fi
          if [ -n "${REPO:-}" ]; then
            ARGS+=("--repo=$REPO")
          fi
          node bootstrap.mjs "${ARGS[@]}"

      - name: Trigger aggregate (if new sentinels were written)
        # Only fire when we actually wrote something — avoids a spurious aggregate run
        # on dry-run dispatches or weeks with no new repos.
        if: >
          github.event_name == 'schedule' ||
          inputs.dry-run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FOUND=$(node -e "try{const r=JSON.parse(require('fs').readFileSync('bootstrap-report.json','utf8'));process.stdout.write(String(r.found.length))}catch{process.stdout.write('0')}")
          if [ "$FOUND" -gt "0" ]; then
            echo "  $FOUND new repo(s) — triggering aggregate"
            gh workflow run aggregate.yml --repo bounded-systems/content-catalog
          else
            echo "  no new repos — skipping aggregate trigger"
          fi

      - name: Upload report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bootstrap-report
          path: bootstrap-report.json
